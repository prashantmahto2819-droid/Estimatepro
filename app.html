<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: app shell — top bar with tabs, one working view; panels stack on phones */
:root{
  --bg:#f5f7fa;--raised:#ffffff;--sunken:#e9edf2;--line:#d3dae3;--line-strong:#7d8a9b;
  --ink:#0f1b2d;--muted:#4a5668;--brand:#0f3f62;--brand-soft:#e3edf5;--on-brand:#ffffff;--brand-text:#1a5a8a;
  --accent:#2da56f;--accent-soft:#e1f3e9;--on-accent:#062a18;--accent-text:#1a7a4c;
  --warn:#8f5200;--warn-soft:#fbefd9;--danger:#b42329;--danger-soft:#fbe4e4;--focus:#1a7a4c;
  --display:Montserrat,"IBM Plex Sans",system-ui,sans-serif;--sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 8px 24px rgba(15,27,45,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1620;--raised:#13212e;--sunken:#07111a;--line:#243647;--line-strong:#5e7387;--ink:#e6ecf3;--muted:#9eacbe;--brand:#5fa3d6;--brand-soft:#13304a;--on-brand:#04121e;--brand-text:#8cc2ea;--accent:#45c487;--accent-soft:#0f3322;--on-accent:#04210f;--accent-text:#5fd49a;--warn:#f0b44c;--warn-soft:#33260f;--danger:#ff7a7a;--danger-soft:#3a1618;--focus:#5fd49a;--shadow:0 8px 24px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1620;--raised:#13212e;--sunken:#07111a;--line:#243647;--line-strong:#5e7387;--ink:#e6ecf3;--muted:#9eacbe;--brand:#5fa3d6;--brand-soft:#13304a;--on-brand:#04121e;--brand-text:#8cc2ea;--accent:#45c487;--accent-soft:#0f3322;--on-accent:#04210f;--accent-text:#5fd49a;--warn:#f0b44c;--warn-soft:#33260f;--danger:#ff7a7a;--danger-soft:#3a1618;--focus:#5fd49a;--shadow:0 8px 24px rgba(0,0,0,.6);color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:20px}
*{box-sizing:border-box}
a{color:var(--brand-text)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.lbl{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:22px;line-height:30px}h2{font-size:18px;line-height:26px}h3{font-size:15px;line-height:22px}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--raised);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:16px;color:var(--brand);letter-spacing:.02em}
.brand img{width:34px;height:34px}
.brand b{color:var(--accent-text)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:8px 10px;border-radius:4px;color:var(--muted);font-weight:500;cursor:pointer;min-height:40px}
.anbox{display:flex;flex-direction:column;gap:6px}.antab td{vertical-align:top}.antab .desc{max-width:420px}tr.adjrow td{background:var(--warn-soft,#fff7e6)}tr.finrow td{background:var(--brand-soft)}
nav.tabs button.due::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#d97706;margin-left:5px;vertical-align:middle}
nav.tabs button[aria-current="page"]{background:var(--brand-soft);color:var(--ink);font-weight:600}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
.av{width:30px;height:30px;border-radius:4px;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
.role{font-size:11px;font-weight:600;padding:1px 6px;border-radius:2px;background:var(--sunken);color:var(--muted)}
.role.sa{background:var(--accent-soft);color:var(--accent-text)}
main{padding:20px 16px 48px;max-width:1440px;margin:0 auto}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:4px;border:1px solid transparent;font-weight:500;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--brand);color:var(--on-brand)}
.btn.acc{background:var(--accent);color:var(--on-accent)}
.btn.sec{background:var(--raised);border-color:var(--line-strong)}
.btn.ghost{background:none;color:var(--brand-text)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.in{height:36px;border:1px solid var(--line-strong);border-radius:4px;background:var(--raised);padding:0 10px;min-width:0}
.in.n{font-family:var(--mono);text-align:right;width:110px}
.in.edited{border-color:var(--accent-text);background:var(--accent-soft)}
.in.small{height:30px;width:92px;font-size:13px}
textarea.in{height:auto;padding:8px 10px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.panel{background:var(--raised);border:1px solid var(--line);border-radius:8px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--raised);padding:0 12px;height:34px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:20px;font-weight:600;padding:0 8px;border-radius:2px;background:var(--sunken);color:var(--ink);white-space:nowrap}
.badge.ed{background:var(--accent-soft);color:var(--accent-text)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.info{background:var(--brand-soft);color:var(--brand-text)}
.badge.dan{background:var(--danger-soft);color:var(--danger)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--raised)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{position:sticky;top:0;background:var(--sunken);color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t th.num{text-align:right}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover{background:var(--sunken)}
.t tr.sel{background:var(--brand-soft)}
.t tfoot td{font-weight:600;background:var(--sunken)}
.desc{max-width:420px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* layouts */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:20px;align-items:start}
.side{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto;padding:18px}
@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--raised)}
.stat .v{font-family:var(--mono);font-size:20px;line-height:28px;font-weight:500}
.rates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rbox{padding:12px;border-radius:6px;background:var(--sunken)}
.rbox.an{background:var(--accent-soft)}
.rbox .v{font-family:var(--mono);font-size:22px;line-height:30px;font-weight:500}
.empty{padding:32px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;font-size:14px;z-index:20}
.list-est{display:flex;flex-direction:column;gap:6px}
.list-est button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--raised);cursor:pointer}
.list-est button[aria-current="true"]{background:var(--brand-soft);border-color:var(--brand-text)}
.est-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.est-grid{grid-template-columns:minmax(0,1fr)}}
.dd{position:absolute;z-index:10;left:0;right:0;top:40px;max-height:360px;overflow:auto;background:var(--raised);border:1px solid var(--line-strong);border-radius:4px;box-shadow:var(--shadow)}
.dd button{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 10px;cursor:pointer}
.dd button:hover,.dd button:focus-visible{background:var(--sunken)}
.sw{width:8px;height:8px;display:inline-block;margin-right:6px;border-radius:1px}
.sw.cpwd{background:var(--brand)}.sw.mp{background:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

[hidden]{display:none!important}
.auth{max-width:400px;margin:48px auto;padding:28px;display:flex;flex-direction:column;gap:14px}
.auth h1{margin:0}.auth p{margin:0}
.auth-logo{width:48px;height:auto}
.fld{display:flex;flex-direction:column;gap:4px}
.fld .in{width:100%}
.auth code{font-family:var(--mono,monospace)}
@media (max-width:640px){.who-name{display:none}}

.google{display:flex;align-items:center;justify-content:center;gap:10px;height:40px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.ed{min-width:0;display:flex;flex-direction:column;gap:14px}
.title-in{width:100%;font-family:var(--display);font-weight:600;font-size:18px;height:40px}
.subtabs{align-self:flex-start;flex-wrap:wrap}
.seg.wrap{flex-wrap:wrap}
.add-row{gap:8px;align-items:flex-start}
table.est td.acts{white-space:nowrap}
table.est td.acts .btn{margin-left:2px}
tr.irow.open td{background:var(--sunken)}
tr.mrow>td{background:var(--sunken);padding:0 12px 14px}
.mpanel{padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-color:var(--brand)}
.mpanel .tw{overflow-x:auto}
select[data-mref]{width:100%;max-width:520px}
.meas{display:flex;flex-direction:column;gap:10px;padding-top:4px}
table.mt{background:var(--raised)}
.unit-s{margin-left:4px;font-size:11px;color:var(--muted)}
table.mt tr.kh input[data-mf$='|d']{font-weight:600}
.meas .mtw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.mt td,table.mt th{padding:4px 6px}
table.mt .in.small{width:62px;padding:0 6px}
table.mt .in.wide{width:100%;min-width:130px}
table.mt tr.km td{background:var(--danger-soft)}
table.mt tr.kh td{font-style:italic}
table.mt tr.ks td{background:var(--brand-soft)}
table.mt select.in.small{width:auto;max-width:170px}
.seg button .cnt{opacity:.75;font-size:.9em}
table.est .desc{max-width:260px}
.meas .grid2{max-width:900px}
@media (min-width:901px){.est-grid{grid-template-columns:230px minmax(0,1fr)}}
.qv{font-family:var(--mono);font-weight:500}
.msum{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.msum strong{font-family:var(--mono)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fld.wide{grid-column:1/-1}
.fld textarea.in{width:100%;resize:vertical;padding:8px}
.panel.form{padding:16px;display:flex;flex-direction:column;gap:14px}
.panel.form h3{margin:6px 0 0}
.parts{display:flex;flex-direction:column;gap:8px;max-width:640px}
.xl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.xl{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--raised)}
.xl p{margin:0;font-size:13px;flex:1}.xl h3{margin:0}
.sw.hort{background:#3b8f4e}.sw.u{background:#8a5cc2}.sw.x{background:#9aa5b1}
.fld .in{width:100%}
@media (max-width:640px){.who-name{display:none}table.est .desc{max-width:200px}}
.lic{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;border-radius:8px;margin:0 0 14px;font-size:14px;line-height:1.45}.lic a{color:inherit;font-weight:600}.lic-trial{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}.lic-exp{background:var(--danger-soft);color:var(--ink);border:1px solid var(--danger)}
#dd-tip{position:fixed;z-index:50;background:var(--raised);color:var(--ink);border:1px solid var(--line-strong);border-radius:6px;box-shadow:var(--shadow);padding:10px 12px;font-size:13px;line-height:1.5;max-height:60vh;overflow:auto;pointer-events:auto}
#dd-tip .tt-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
#dd-tip .tt-h .num{margin-left:auto;font-weight:600}
#dd-tip .tt-b{white-space:pre-wrap}
#dd-tip .tt-pic{float:right;width:150px;margin:0 0 6px 10px}
#ip-pop{position:fixed;z-index:55;background:var(--raised);color:var(--ink);border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:6px}
.ip-img{width:100%;aspect-ratio:3/2;border-radius:6px;overflow:hidden;background:#f5f8fb;display:flex;align-items:center;justify-content:center}
.ip-img svg,.ip-img img{width:100%;height:100%;object-fit:contain;display:block}
.ip-cap{font-size:12px;color:var(--muted)}.ip-desc{font-size:12px;line-height:1.4;max-height:7.2em;overflow:auto;color:var(--ink)}.ip-act{display:flex;flex-wrap:wrap;gap:4px}.ip-act .btn{text-decoration:none}
.pic-b{border:0;background:none;padding:0 2px;cursor:pointer;font-size:14px;line-height:1;align-self:flex-start;opacity:.75}.pic-b:hover{opacity:1}
.ddi{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:8px;border-radius:50%;border:1px solid var(--line-strong);font:italic 700 11px/1 Georgia,serif;color:var(--muted);vertical-align:middle;cursor:help}
.ddi:hover{color:var(--ink);border-color:var(--ink)}
.dd{max-height:min(460px,60vh)}
.dd button{align-items:start;padding:10px 12px}
.dd .desc{max-width:none;-webkit-line-clamp:3;font-size:13px;line-height:1.45;color:var(--ink)}
.dd .num{white-space:nowrap;font-weight:600}
.dd mark,#dd-tip mark{background:var(--warn-soft);color:inherit;border-radius:2px;padding:0 1px}
@media (max-width:640px){.dd button{grid-template-columns:64px minmax(0,1fr)}.dd .num{grid-column:2}}
.nu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
tr.uedit td{background:var(--sunken)}
.app-foot{text-align:center;color:var(--muted);font-size:12px;padding:24px 16px 32px}.app-foot a{color:var(--brand-text)}
.ns-box{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:12px 14px;background:var(--raised)}
.ns-box h3{font-size:15px}
.ns-t td{vertical-align:middle}
.ns-t input.wide{width:100%;min-width:180px}
.ns-q{display:flex;flex-direction:column;gap:8px;padding:6px 0}
.ns-res{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:10px 12px;background:var(--accent-soft);border-radius:6px;font-size:14px}
.ns-dd{top:40px}
.dd .dd-h{padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);background:var(--sunken)}
.dd button.dd-mk{display:block;text-align:left;font-weight:600;color:var(--accent-text);background:var(--accent-soft)}
.dd button.nsrow{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.bbs{display:flex;flex-direction:column;gap:6px}
.bbs-r{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:flex-end}
.bf{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted)}
.bbs-out{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;padding:6px 8px;background:var(--sunken);border-radius:4px}
.rf-box{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:6px;padding:10px 12px;margin:6px 0}
table.rf-sum td,table.rf-sum th{white-space:nowrap}
.est-grid{grid-template-columns:minmax(0,1fr)!important;gap:14px}
.proj-bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;padding:12px 14px}
.pb-owner{min-width:200px}
.pb-pick{position:relative;display:flex;flex-direction:column;gap:4px;flex:1;min-width:240px}
.pb-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;cursor:pointer;width:100%}
.pb-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-meta{white-space:nowrap;font-size:12px}
.proj-pop{position:absolute;z-index:30;top:100%;left:0;right:0;margin-top:4px;background:var(--raised);border:1px solid var(--line-strong);border-radius:6px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:8px;max-height:min(70vh,520px)}
.pp-list{overflow:auto;display:flex;flex-direction:column}
.pp-list button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 10px;cursor:pointer;color:var(--ink)}
.pp-list button span{font-size:12px}
.pp-list button:hover,.pp-list button:focus-visible{background:var(--sunken)}
.pp-list button[aria-selected="true"]{background:var(--brand-soft)}
.pp-new{border-top:1px solid var(--line);padding-top:8px}
.scope-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;background:var(--brand-soft);border-radius:8px}
.scope-bar .note{flex-basis:100%;font-size:13px;color:var(--muted)}
.sg{display:flex;flex-direction:column;gap:14px}
.dept-sel{height:30px;font-size:12.5px;padding:0 4px;width:96px}
@media (max-width:1500px){.who-name{display:none}}
.firm-box{padding:12px 14px;border:1px dashed var(--line-strong);border-radius:8px;background:var(--sunken)}
.ds{display:flex;flex-direction:column;gap:12px}
.ds-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.ds-cat{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.ds-mods{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ds-mod{border:1px solid var(--line-strong);background:var(--raised);color:var(--ink);border-radius:16px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.ds-mod[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.ds-in{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ds-grp{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--bg)}
.ds-grp>summary{cursor:pointer;font-weight:600;padding:2px 0}
.ds-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 12px;padding:8px 0 4px}
.ds-fields .fld{display:flex;flex-direction:column;gap:3px;font-size:13px}
.lbl2{font-size:12.5px;color:var(--ink)}
